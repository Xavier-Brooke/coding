<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            margin: 0px;
            padding: 0px;
            border: border-box;
        }
    </style>

    <link rel="stylesheet" href="../style/navBarPannelOne.css">

    <title>Amazon</title>
</head>
<body>
    
    <!-- navBar -->
    <header>
        <!-- navBar (Pannel One) -->
        <div class="nav-bar pannel-one">

            <div class="nav-bar-pannel-one-info pannel-one-logo"><img src="../assests/amazon_logo.png" alt="amazon_logo"></div>

            <div class="nav-bar-pannel-one-info pannel-one-address">
                <p class="address-one">Delivering to Mohali 16055</p>
                <p class="address-two"><i class="fa-solid fa-location-dot"></i>Update Location</p>
            </div>

            <div class="nav-bar-pannel-one-info pannel-one-searchBox">
                <div class="search-options">
                    <select>
                        <option value="All">All</option>
                    </select>
                </div>
                <div class="search-options">
                    <input type="text" placeholder="Search Amazon.in">
                </div>
                <div class="search-options">
                    <span><i class="fa-solid fa-magnifying-glass"></i></span>
                </div>
            </div>

            <div class="nav-bar-pannel-one-info flag-div">
                <span class="flag"><img src="../assests/indianFlag.svg" alt="indianFlag"></span>
                <span class="title">En</span>
            </div>

            <div class="nav-bar-pannel-one-info"></div>

            <div class="nav-bar-pannel-one-info"></div>

            <div class="nav-bar-pannel-one-info"></div>
        </div>

        <div class="nav-bar pannel-two"></div>
    </header>

</body>
</html>
