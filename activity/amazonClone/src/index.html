<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="../style/navBar/pannelOne.css">
    <link rel="stylesheet" href="../style/navBar/pannelTwo.css">
    <link rel="stylesheet" href="../style/navBar/pannelThree.css">
    <link rel="stylesheet" href="../style/contentContainer.css">
    <link rel="stylesheet" href="../style/footer/footerOne.css">

    <title>Amazon</title>

</head>
<body>
    
    <!-- navBar -->
    <header>

        <!-- Pannel One -->
        <div class="navPannel-one">

            <div class="logo border-animation">
                <img src="../assests/amazonLogo.png" alt="amazonLogo">
            </div>

            <div class="location border-animation">
                <span class="info">Delivering to Mohali 160055</span>
                <div class="location-icon"><i class="fa-solid fa-location-dot"></i>Update Location</div>
            </div>

            <!-- Search Box -->
            <div class="search-box border-animation">
                <div class="select search-option">
                    <select>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="search-area search-option">Search in Amazon.com</div>
                <div class="search-icon search-option"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>

            <!-- Country And Language -->
            <div class="country border-animation">
                <div class="icon"><img src="../assests/indianFlag.png" alt="indianFlag"></div>
                <div class="language">En</div>
            </div>

            <!-- login option -->
            <div class="login border-animation">
                <div id="login-info-one">Hello, sign in</div>
                <div id="login-info-two">Account & Lists</div>
            </div>

            <!-- returns and orders -->
            <div class="returns-orderes border-animation">
                <div id="returns">Returns</div>
                <div id="orders">& Orders</div>
            </div>

            <!-- Cart -->
            <div class="cart border-animation">
                <div><i class="fa-solid fa-cart-shopping"></i>Cart</div>
            </div>

        </div>

        <!-- Pannel Two -->
        <div class="navPannel-two">

            <div class="pannel-info">
                <span id="hambarger-icon" class="border-animation"><i class="fa-solid fa-bars"></i>All</span>
                <span class="border-animation">Fresh</span>
                <span class="border-animation">Prime Video</span>
                <span class="border-animation">Sell</span>
                <span class="border-animation">Bestsellers</span>
                <span class="border-animation">Today's Deals</span>
                <span class="border-animation">Mobiles</span>
                <span class="border-animation">Books</span>
                <span class="border-animation">Flights</span>
                <span class="border-animation">eBooks</span>
                <span class="border-animation">Subscribe & Save</span>
                <span class="border-animation">Audible</span>
                <span class="border-animation">AmazonBasics</span>
            </div>
            <div class="pannel-info"></div>

        </div>

        <div class="navPannel-three"></div>

        <div class="content-container">
            <div class="content-items">
                <img src="../assests/img/img1.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img2.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img3.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img4.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img5.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img6.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img7.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img8.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img9.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img10.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img11.webp" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img12.webp" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img13.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img14.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img15.jpg" alt="img">
            </div>
            <div class="content-items">
                <img src="../assests/img/img16.jpg" alt="img">
            </div>
        </div>

    </header>

    <footer>

        <div class="footer">

            <div class="footer-one">Back to Top</div>

            <div class="footer-two">

                <div class="footer-two-content"></div>
                <div class="footer-two-content"></div>
                <div class="footer-two-content"></div>
                <div class="footer-two-content"></div>

            </div>
        </div>

    </footer>

</body>
</html>
