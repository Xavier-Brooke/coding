<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="../style/navBar/pannelOne.css">
    <link rel="stylesheet" href="../style/navBar/pannelTwo.css">

    <title>Amazon</title>

</head>
<body>
    
    <!-- navBar -->
    <header>

        <!-- Pannel One -->
        <div class="navPannel-one">

            <div class="logo">
                <img src="../assests/amazonLogo.png" alt="amazonLogo">
            </div>

            <div class="location">
                <span class="info">Delivering to Mohali 160055</span>
                <div class="location-icon"><i class="fa-solid fa-location-dot"></i>Update Location</div>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <div class="select search-option">
                    <select>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="search-area search-option">Search in Amazon.com</div>
                <div class="search-icon search-option"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>

            <!-- Country And Language -->
            <div class="country">
                <div class="icon"><img src="../assests/indianFlag.png" alt="indianFlag"></div>
                <div class="language">En</div>
            </div>

            <!-- login option -->
            <div class="login">
                <div id="login-info-one">Hello, sign in</div>
                <div id="login-info-two">Account & Lists</div>
            </div>

            <!-- returns and orders -->
            <div class="returns-orderes">
                <div id="returns">Returns</div>
                <div id="orders">& Orders</div>
            </div>

            <!-- Cart -->
            <div class="cart">
                <div><i class="fa-solid fa-cart-shopping"></i>Cart</div>
            </div>

        </div>

        <!-- Pannel Two -->
        <div class="navPannel-two">



        </div>

    </header>

</body>
</html>
